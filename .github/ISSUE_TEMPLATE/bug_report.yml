name: Bug report
description: Report a problem building or using ps4-kstuff
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Include the console firmware, exact steps, and any log output you can provide.
  - type: input
    id: firmware
    attributes:
      label: Console firmware
      placeholder: e.g. 9.00
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: What are you using?
      options:
        - kstuff.elf
        - kstuff.bin
        - libkstuff.a in my own payload
        - Kernel payload (kstuff-kernel.bin)
        - Build or sync tooling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Include the commands or steps that reproduce the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the payload output or klog lines that start with [Kstuff] as text.
      render: shell
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: ELF or BIN loader and exploit
      description: If the problem happens while running on console.
  - type: input
    id: version
    attributes:
      label: ps4-kstuff version
      description: Release or output of git rev-parse --short HEAD.
  - type: input
    id: host
    attributes:
      label: Build computer and OS
      placeholder: e.g. Ubuntu 24.04
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues for the same problem
          required: true
