name: Feature request
description: Suggest an improvement to ps4-kstuff
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: For larger changes, open an issue before starting work so the approach can be discussed.
  - type: input
    id: firmware
    attributes:
      label: Firmware it applies to
      description: Leave empty if it applies to every supported firmware.
      placeholder: e.g. 11.00
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to do?
      description: Describe the use case and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues for the same request
          required: true
